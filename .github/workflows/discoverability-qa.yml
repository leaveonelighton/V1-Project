name: Discoverability QA

on:
  pull_request:
    paths:
      - '*.html'
      - '**/*.html'
      - '.htaccess'
      - 'sitemap.xml'
      - 'scripts/check-discoverability.py'
      - '.github/workflows/discoverability-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discoverability-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Audit public canonicals and sitemap
        run: python3 scripts/check-discoverability.py

      - name: Confirm legacy redirect
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RedirectMatch 301 ^/when-does-a-second-chance-become-real\.html$ https://leaveonelighton.org/research/when-does-a-second-chance-become-real.html' .htaccess
          echo 'LEGACY REDIRECT OK'
