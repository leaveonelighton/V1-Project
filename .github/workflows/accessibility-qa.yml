name: Accessibility QA

on:
  pull_request:
    paths:
      - '**/*.html'
      - '**/*.css'
      - '**/*.js'
      - 'scripts/check-accessibility.py'
      - '.github/workflows/accessibility-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit structural accessibility
        run: python3 scripts/check-accessibility.py
