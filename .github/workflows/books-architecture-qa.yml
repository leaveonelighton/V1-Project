name: Books architecture QA

on:
  pull_request:
    paths:
      - 'books.html'
      - 'books/**'
      - 'recommendations/index.html'
      - 'data/resource-recommendations.json'
      - 'affiliate-disclosure/index.html'
      - 'sitemap.xml'
      - '.htaccess'
      - '.github/workflows/books-architecture-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  books-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm two-book movement shelf
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -c 'class="library-book"' books.html)
          test "$count" -eq 2
          grep -q '<h2>Leave One Light On</h2>' books.html
          grep -q '<h2>The Light in the Window</h2>' books.html
          grep -q 'The Light in the Window tells the story.' books.html
          grep -q 'invites us to live it.' books.html
          echo 'TWO-BOOK MOVEMENT SHELF OK'

      - name: Confirm verified Amazon book mappings
        shell: bash
        run: |
          set -euo pipefail

          light_short='https://amzn.to/45Wp9TT'
          leave_short='https://amzn.to/3Sji4te'
          light_search='https://www.amazon.com/s?k=the+light+in+the+window+book+by+theodore+johnson&crid=BZ7NLBE8NQTH&sprefix=the+light+in+the+window+book+%2Caps%2C183&linkCode=ll2&tag=mybookwebs03c-20&linkId=517aee9da4edc4b6c45f6ed4a5809eb7&language=en_US&ref_=as_li_ss_tl'
          leave_search='https://www.amazon.com/s?k=leave+one+light+on+book+by+Theodore+Johnson&crid=1T47HE7OTQQFM&sprefix=leave+one+light+on+book+by+theodore+johnson%2Caps%2C172&linkCode=ll2&tag=mybookwebs03c-20&linkId=40fbc60c16bcbf59e777df38fcf362a5&language=en_US&ref_=as_li_ss_tl'

          grep -Fq "$light_short" books.html
          grep -Fq "$leave_short" books.html
          grep -Fq "$light_search" books.html
          grep -Fq "$leave_search" books.html

          grep -Fq "$leave_short" books/leave-one-light-on.html
          grep -Fq "$leave_search" books/leave-one-light-on.html
          grep -Fq 'https://www.amazon.com/dp/B0HCCL1GZR' books/leave-one-light-on.html

          grep -Fq "$light_search" recommendations/index.html
          grep -Fq "$leave_search" recommendations/index.html
          grep -Fq 'data-resource-id="light-window-amazon"' recommendations/index.html
          grep -Fq 'data-resource-id="leave-one-light-on-amazon"' recommendations/index.html

          grep -Fq '"canonical_url": "https://www.amazon.com/dp/B0H7QP4HSY"' data/resource-recommendations.json
          grep -Fq '"canonical_url": "https://www.amazon.com/dp/B0HCCL1GZR"' data/resource-recommendations.json
          grep -Fq '"affiliate_short_url": "https://amzn.to/45Wp9TT"' data/resource-recommendations.json
          grep -Fq '"affiliate_short_url": "https://amzn.to/3Sji4te"' data/resource-recommendations.json
          grep -Fq 'tag=mybookwebs03c-20' books.html
          grep -Fq 'As an Amazon Associate I earn from qualifying purchases.' affiliate-disclosure/index.html

          if grep -R -Fq 'B0FFV7V2GW' -- books.html books recommendations data/resource-recommendations.json affiliate-disclosure/index.html; then
            echo 'Forbidden non-book ASIN B0FFV7V2GW found in book purchase surfaces.' >&2
            exit 1
          fi

          echo 'VERIFIED AMAZON BOOK MAPPINGS OK'

      - name: Confirm intentional book detail files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(find books -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sort)
          expected=$(printf '%s\n' \
            'leave-one-light-on.html' \
            'the-light-in-the-window-reader-materials.html' \
            'the-light-in-the-window.html' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          echo 'BOOK DETAIL FILE SET OK'

      - name: Confirm reader materials canonical
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<link rel="canonical" href="https://leaveonelighton.org/books/the-light-in-the-window-reader-materials.html">' books/the-light-in-the-window-reader-materials.html
          echo 'READER MATERIALS CANONICAL OK'

      - name: Confirm book URLs in sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          expected = {
              'https://leaveonelighton.org/books.html',
              'https://leaveonelighton.org/books/leave-one-light-on.html',
              'https://leaveonelighton.org/books/the-light-in-the-window.html',
              'https://leaveonelighton.org/books/the-light-in-the-window-reader-materials.html',
          }

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = {
              node.text.strip()
              for node in root.findall('sm:url/sm:loc', ns)
              if node.text and node.text.strip().startswith('https://leaveonelighton.org/books')
          }

          if urls != expected:
              raise SystemExit(f'Unexpected book URL set in sitemap: {sorted(urls)}')

          print('BOOK SITEMAP SET OK')
          PY

      - name: Confirm canonical bare Books redirect
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RedirectMatch 301 ^/books/?$ https://leaveonelighton.org/books.html' .htaccess
          grep -Fq 'RedirectMatch 301 ^/book\.html$ https://leaveonelighton.org/books.html' .htaccess
          echo 'BOOK REDIRECTS OK'
