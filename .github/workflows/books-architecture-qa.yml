name: Books architecture QA

on:
  pull_request:
    paths:
      - 'books.html'
      - 'books/**'
      - 'recommendations/index.html'
      - 'data/resource-recommendations.json'
      - 'affiliate-disclosure/index.html'
      - 'thelightinthewindowbook.com/**'
      - 'sitemap.xml'
      - '.htaccess'
      - '.github/workflows/books-architecture-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  books-guards:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm two-book movement shelf
        shell: bash
        run: |
          set -euo pipefail
          count=$(grep -c 'class="library-book"' books.html)
          test "$count" -eq 2
          grep -q '<h2>Leave One Light On</h2>' books.html
          grep -q '<h2>The Light in the Window</h2>' books.html
          grep -q 'The Light in the Window tells the story.' books.html
          grep -q 'invites us to live it.' books.html
          echo 'TWO-BOOK MOVEMENT SHELF OK'

      - name: Confirm movement and book-site purchase separation
        shell: bash
        run: |
          set -euo pipefail

          light_direct='https://www.amazon.com/dp/B0H7QP4HSY'
          leave_direct='https://www.amazon.com/dp/B0HCCL1GZR'
          book_site_affiliate='https://amzn.to/45Wp9TT'

          # Movement shelf: clickable covers and buttons stay transactional,
          # but use clean direct product URLs with no Associates tracking.
          test "$(grep -Fc "$light_direct" books.html)" -ge 2
          test "$(grep -Fc "$leave_direct" books.html)" -ge 2
          grep -Fq "$leave_direct" books/leave-one-light-on.html
          grep -Fq "$light_direct" recommendations/index.html
          grep -Fq "$leave_direct" recommendations/index.html
          grep -Fq 'data-resource-id="light-window-amazon"' recommendations/index.html
          grep -Fq 'data-resource-id="leave-one-light-on-amazon"' recommendations/index.html

          movement_paths=(
            books.html
            books
            recommendations/index.html
            data/resource-recommendations.json
            affiliate-disclosure/index.html
          )

          if grep -R -nE 'amzn\.to/|tag=mybookwebs03c-20' -- "${movement_paths[@]}"; then
            echo 'Amazon Associates tracking found on LeaveOneLightOn.org movement surfaces.' >&2
            exit 1
          fi

          if grep -R -nF 'As an Amazon Associate I earn from qualifying purchases.' -- "${movement_paths[@]}"; then
            echo 'Amazon Associate earning statement belongs on the separate book property, not movement surfaces.' >&2
            exit 1
          fi

          if grep -R -nF 'class="affiliate-label"' -- books.html books/leave-one-light-on.html recommendations/index.html; then
            echo 'Affiliate badge returned to movement book surfaces.' >&2
            exit 1
          fi

          if grep -R -nF 'rel="noopener noreferrer sponsored"' -- books.html books/leave-one-light-on.html recommendations/index.html; then
            echo 'Sponsored relationship marker returned to movement book/recommendation surfaces.' >&2
            exit 1
          fi

          # Recommendation governance data must describe the movement links as non-affiliate.
          python3 - <<'PY'
          import json

          with open('data/resource-recommendations.json', encoding='utf-8') as handle:
              data = json.load(handle)

          expected = {
              'light-window-amazon': 'https://www.amazon.com/dp/B0H7QP4HSY',
              'leave-one-light-on-amazon': 'https://www.amazon.com/dp/B0HCCL1GZR',
          }
          records = {item['id']: item for item in data['resources']}
          for resource_id, canonical in expected.items():
              record = records[resource_id]
              assert record['canonical_url'] == canonical, (resource_id, record['canonical_url'])
              assert record.get('affiliate_program') == 'none', resource_id
              assert record.get('affiliate_eligible') is False, resource_id
              assert 'affiliate_url' not in record, resource_id
              assert 'affiliate_short_url' not in record, resource_id

          print('MOVEMENT BOOK DATA NON-AFFILIATE OK')
          PY

          # Separate commercial book property: Associates is allowed, and disclosure is local to it.
          grep -Fq "$book_site_affiliate" thelightinthewindowbook.com/buy.html
          grep -Fq '<strong>Affiliate link.</strong> As an Amazon Associate I earn from qualifying purchases.' thelightinthewindowbook.com/buy.html
          grep -Fq 'rel="noopener noreferrer sponsored"' thelightinthewindowbook.com/buy.html

          if grep -R -Fq 'B0FFV7V2GW' -- books.html books recommendations data/resource-recommendations.json affiliate-disclosure/index.html thelightinthewindowbook.com; then
            echo 'Forbidden non-book ASIN B0FFV7V2GW found in book purchase surfaces.' >&2
            exit 1
          fi

          echo 'MOVEMENT / BOOK-SITE COMMERCE SEPARATION OK'

      - name: Confirm intentional book detail files
        shell: bash
        run: |
          set -euo pipefail
          actual=$(find books -maxdepth 1 -type f -name '*.html' -printf '%f\n' | sort)
          expected=$(printf '%s\n' \
            'leave-one-light-on.html' \
            'the-light-in-the-window-reader-materials.html' \
            'the-light-in-the-window.html' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          echo 'BOOK DETAIL FILE SET OK'

      - name: Confirm reader materials canonical
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<link rel="canonical" href="https://leaveonelighton.org/books/the-light-in-the-window-reader-materials.html">' books/the-light-in-the-window-reader-materials.html
          echo 'READER MATERIALS CANONICAL OK'

      - name: Confirm book URLs in sitemap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          expected = {
              'https://leaveonelighton.org/books.html',
              'https://leaveonelighton.org/books/leave-one-light-on.html',
              'https://leaveonelighton.org/books/the-light-in-the-window.html',
              'https://leaveonelighton.org/books/the-light-in-the-window-reader-materials.html',
          }

          root = ET.parse('sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = {
              node.text.strip()
              for node in root.findall('sm:url/sm:loc', ns)
              if node.text and node.text.strip().startswith('https://leaveonelighton.org/books')
          }

          if urls != expected:
              raise SystemExit(f'Unexpected book URL set in sitemap: {sorted(urls)}')

          print('BOOK SITEMAP SET OK')
          PY

      - name: Confirm canonical bare Books redirect
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'RedirectMatch 301 ^/books/?$ https://leaveonelighton.org/books.html' .htaccess
          grep -Fq 'RedirectMatch 301 ^/book\.html$ https://leaveonelighton.org/books.html' .htaccess
          echo 'BOOK REDIRECTS OK'
