name: TEMP live HSTS verify

on:
  pull_request:
    paths:
      - ".github/workflows/temp-live-hsts-verify.yml"

permissions:
  contents: read

jobs:
  live-hsts-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployed HSTS
        run: >-
          python3 -c "import os, runpy;
          os.environ['GITHUB_EVENT_NAME']='diagnostic';
          runpy.run_path('scripts/check-hsts-live.py', run_name='__main__')"
